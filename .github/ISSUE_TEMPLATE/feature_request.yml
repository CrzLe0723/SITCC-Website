name: Feature Request
description: Suggest a new feature or improvement for the SITCC
title: "[Feature] "
labels:
  - ["feature"]
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement you are proposing.
      placeholder: Explain your idea.
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Why?
      description: What problem would this solve or what would it improve?
      placeholder: Explain the purpose or benefit of the feature.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How could this feature work?
      placeholder: Describe how you think the feature could be implemented.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What other solutions or approaches have you considered?
      placeholder: Describe any alternatives you considered.

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Add mockups, screenshots, references, or other relevant information.
      placeholder: Anything else that would help explain the proposal?
